name: Generate & Upload Daily Long-Form Video

on:
  schedule:
    # Once daily at 12:00 UTC (noon)
    - cron: "0 12 * * *"
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  generate-long:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation libass-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate and upload long-form video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
        run: python scripts/generate_long.py

      - name: Upload video artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-video-${{ github.run_number }}
          path: output_long/
          retention-days: 3
