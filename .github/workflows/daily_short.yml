name: Generate & Upload Daily Short

on:
  schedule:
    # 5 videos per day targeting US peak hours (EDT = UTC-4)
    - cron: "0 16 * * *"   # 12pm EDT — lunch
    - cron: "0 19 * * *"   # 3pm EDT — after school
    - cron: "0 21 * * *"   # 5pm EDT — after work
    - cron: "0 23 * * *"   # 7pm EDT — prime time
    - cron: "0 1 * * *"    # 9pm EDT — late evening
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  generate-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation libass-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Debug checkout
        run: |
          git log --oneline -1
          grep -n "subtitles\|SRT\|drawtext" scripts/generate_short.py | head -5

      - name: Generate and upload Short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
        run: python scripts/generate_short.py

      - name: Upload video artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video-${{ github.run_number }}
          path: output/
          retention-days: 3
