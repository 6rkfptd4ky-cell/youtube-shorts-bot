name: Generate & Upload Daily Short

on:
  schedule:
    # 3 videos per day: 8 AM, 2 PM, 8 PM UTC
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  generate-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Patch font path for Linux
        run: |
          # Replace macOS font path with Linux equivalent in script
          sed -i 's|/System/Library/Fonts/Helvetica.ttc|/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf|g' scripts/generate_short.py

      - name: Generate and upload Short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
        run: python scripts/generate_short.py

      - name: Upload video artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video-${{ github.run_number }}
          path: output/
          retention-days: 3
